services:
  mongo:
    image: mongo:8
    container_name: demojava-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-demo}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-demo}
      MONGO_INITDB_DATABASE: ${DB_NAME:-demo}
    volumes:
      - mongo_data:/data/db
    networks:
      - demo-net
    restart: unless-stopped
    profiles:
      - local   # ⬅️ SOLO para local

  demo-java:
    image: ${IMAGE_URI:-demo-java-local}
    container_name: demo-java-app
    environment:
      SPRING_PROFILES_ACTIVE: mongo
      DB_ENGINE: mongo

      # 🔑 LA CLAVE
      MONGODB_URI: ${MONGODB_URI:-mongodb://demo:demo@mongo:27017/demo}

    ports:
      - "${APP_PORT:-8081}:8081"
    networks:
      - demo-net
    restart: unless-stopped

networks:
  demo-net:
    driver: bridge

volumes:
  mongo_data: