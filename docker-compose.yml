services:
  mysql:
    image: mysql:8
    container_name: demojava-mysql
    profiles: ["local-mysql"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-demo}
      MYSQL_USER: ${DB_USER:-demo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    networks: [demo-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${DB_USER:-demo} -p${DB_PASSWORD:-demo} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    #local
  demo-java-local:
    image: ${IMAGE_URI:-demo-java-local}
    container_name: demo-java-app-local
    profiles: ["local-mysql"]
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_ENGINE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-demo}
      DB_USER: ${DB_USER:-demo}
      DB_PASSWORD: ${DB_PASSWORD:-demo}
      DB_USE_SSL: "false"
    ports:
      - "${APP_PORT:-8082}:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [demo-net]
    restart: unless-stopped

  demo-java-remote:
    image: ${IMAGE_URI:-demo-java-local}
    container_name: demo-java-app-remote
    profiles: ["remote-mysql"]
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_ENGINE: mysql
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-demo}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_USE_SSL: ${DB_USE_SSL:-true}
    ports:
      - "${APP_PORT:-8082}:8081"
    networks: [demo-net]
    restart: unless-stopped

networks:
  demo-net:
    driver: bridge