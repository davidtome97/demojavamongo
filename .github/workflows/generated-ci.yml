name: CI-demo-java-mongo

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Test (Maven)
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw -B -f pom.xml test
          else
            mvn -B -f pom.xml test
          fi

  sonar:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SonarCloud Analysis (optional)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "Sonar secrets not configured. Skipping Sonar analysis."
            exit 0
          fi

          # Default típico en SonarCloud si no lo defines
          if [ -z "$SONAR_HOST_URL" ]; then
            SONAR_HOST_URL="https://sonarcloud.io"
          fi

          SONAR_CMD="verify org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
            -Dsonar.organization=${SONAR_ORGANIZATION} \
            -Dsonar.host.url=${SONAR_HOST_URL}"

          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw -B -f pom.xml $SONAR_CMD
          else
            mvn -B -f pom.xml $SONAR_CMD
          fi

  build_and_push_ecr:
    runs-on: ubuntu-latest
    needs: build_and_test
    # Push a main y tags (NO PR)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building image: ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}" .

          echo "Tagging latest..."
          docker tag "${IMAGE_URI}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Pushing images..."
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Done ✅"

  deploy_ec2:
    runs-on: ubuntu-latest
    needs: build_and_push_ecr
    if: startsWith(github.ref, 'refs/tags/')

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_LLAVE_SSH: ${{ secrets.EC2_LLAVE_SSH }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}

      IMAGE_TAG: ${{ github.sha }}

      # DB comunes
      DB_ENGINE: ${{ secrets.DB_ENGINE }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}

      # SOLO remote (pueden estar vacías si DB_MODE=local)
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # local|remote
      DB_MODE: ${{ secrets.DB_MODE }}

      APP_PORT: ${{ secrets.APP_PORT }}

    steps:
      - uses: actions/checkout@v4

      - name: Preparar clave SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          printf "%s" "${EC2_LLAVE_SSH}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -n "${EC2_KNOWN_HOSTS}" ]; then
            echo "${EC2_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Subir docker-compose.yml a EC2
        run: |
          set -e
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" "mkdir -p ~/app"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes docker-compose.yml "$EC2_USER@$EC2_HOST:~/app/docker-compose.yml"

      - name: Ejecutar despliegue en EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" 'bash -se' <<'EOF'
          set -euo pipefail

          clean() { printf '%s' "${1:-}" | tr -d '\r' | tr -d '\n'; }

          # ---------- Dependencias ----------
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y awscli
          fi

          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y docker.io
            sudo systemctl enable --now docker
          fi

          if ! sudo docker compose version >/dev/null 2>&1; then
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi

          cd ~/app

          # ---------- Proyecto fijo ----------
          export COMPOSE_PROJECT_NAME="demo-java"

          # ---------- Inputs desde GitHub env (ya están en la sesión SSH) ----------
          DB_MODE_IN="$(clean "${DB_MODE:-}")"
          DB_ENGINE_IN="$(clean "${DB_ENGINE:-postgres}")"
          DB_PORT_IN="$(clean "${DB_PORT:-}")"
          DB_NAME_IN="$(clean "${DB_NAME:-}")"
          APP_PORT_IN="$(clean "${APP_PORT:-}")"

          # Defaults
          [ -z "$DB_MODE_IN" ] && DB_MODE_IN="local"      # ✅ default LOCAL
          [ -z "$DB_PORT_IN" ] && DB_PORT_IN="5432"
          [ -z "$DB_NAME_IN" ] && DB_NAME_IN="demo"
          [ -z "$APP_PORT_IN" ] && APP_PORT_IN="8081"

          if [ "$DB_MODE_IN" != "local" ] && [ "$DB_MODE_IN" != "remote" ]; then
            echo "DB_MODE inválido: $DB_MODE_IN (usa local o remote)"
            exit 1
          fi

          export COMPOSE_PROFILES="$DB_MODE_IN"
          export DB_ENGINE="$DB_ENGINE_IN"
          export DB_PORT="$DB_PORT_IN"
          export DB_NAME="$DB_NAME_IN"
          export APP_PORT="$APP_PORT_IN"

          echo "Deploy con perfil: $COMPOSE_PROFILES"
          echo "DB_ENGINE=$DB_ENGINE DB_NAME=$DB_NAME DB_PORT=$DB_PORT APP_PORT=$APP_PORT"

          # ---------- DB_HOST según modo ----------
          if [ "$COMPOSE_PROFILES" = "local" ]; then
            # ✅ En local NO necesitas secrets DB_HOST/DB_USER/DB_PASSWORD
            case "$DB_ENGINE" in
              postgres) export DB_HOST="postgres"; export DB_USER="${DB_USER:-demo}"; export DB_PASSWORD="${DB_PASSWORD:-demo}" ;;
              mysql)    export DB_HOST="mysql";    export DB_USER="${DB_USER:-demo}"; export DB_PASSWORD="${DB_PASSWORD:-demo}" ;;
              mongo)    export DB_HOST="mongo";    export DB_USER="${DB_USER:-demo}"; export DB_PASSWORD="${DB_PASSWORD:-demo}" ;;
              *) echo "DB_ENGINE inválido en local: $DB_ENGINE (usa postgres|mysql|mongo)"; exit 1 ;;
            esac
          else
            # ✅ Remote: obligatorios
            export DB_HOST="$(clean "${DB_HOST:-}")"
            export DB_USER="$(clean "${DB_USER:-}")"
            export DB_PASSWORD="$(clean "${DB_PASSWORD:-}")"

            if [ -z "$DB_HOST" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
              echo "Faltan secrets para remote: DB_HOST, DB_USER, DB_PASSWORD"
              exit 1
            fi

            # Imagen desde ECR
            AWS_REGION_IN="$(clean "${AWS_REGION}")"
            AWS_ACCOUNT_ID_IN="$(clean "${AWS_ACCOUNT_ID}")"
            ECR_REPOSITORY_IN="$(clean "${ECR_REPOSITORY}")"
            IMAGE_TAG_IN="$(clean "${IMAGE_TAG}")"

            ECR_REGISTRY="${AWS_ACCOUNT_ID_IN}.dkr.ecr.${AWS_REGION_IN}.amazonaws.com"
            export IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY_IN}:${IMAGE_TAG_IN}"

            echo "Login ECR: ${ECR_REGISTRY}"
            aws ecr get-login-password --region "${AWS_REGION_IN}" \
              | sudo -E docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          fi

          # ---------- Stop stack anterior (proyecto fijo + profile) ----------
          sudo -E docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml --profile "$COMPOSE_PROFILES" down --remove-orphans || true

          # Limpieza extra por si quedó red pillada
          sudo docker network ls --format '{{.Name}}' | grep -E "^${COMPOSE_PROJECT_NAME}_" | xargs -r sudo docker network rm || true

          # ---------- Up según modo ----------
          if [ "$COMPOSE_PROFILES" = "remote" ]; then
            sudo -E docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml --profile remote pull
            sudo -E docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml --profile remote up -d --remove-orphans
          else
            sudo -E docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml --profile local up -d --build --remove-orphans
          fi

          sudo docker image prune -f || true
          echo "Estado:"
          sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}'
          EOF