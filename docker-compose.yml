services:
  # Mongo LOCAL (solo se levanta si no hay MONGODB_URI)
  mongo:
    image: mongo:8
    container_name: demojava-mongo
    profiles: ["local"]   # <-- solo con perfil local
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-demo}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-demo}
      MONGO_INITDB_DATABASE: ${DB_NAME:-demo}
    networks:
      - demo-net
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    # En producción recomendado NO exponer Mongo:
    # ports:
    #   - "${DB_PORT:-27017}:27017"

  demo-java:
    image: ${IMAGE_URI:-demo-java-local}
    container_name: demo-java-app
    environment:
      SPRING_PROFILES_ACTIVE: mongo
      DB_ENGINE: mongo

      # ✅ REMOTO: si existe, Spring lo usa directamente
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:-}

      # ✅ LOCAL (fallback): si no hay URI, usa host/port
      DB_HOST: ${DB_HOST:-mongo}
      DB_PORT: ${DB_PORT:-27017}

      DB_NAME: ${DB_NAME:-demo}
      DB_USER: ${DB_USER:-demo}
      DB_PASSWORD: ${DB_PASSWORD:-demo}

    ports:
      - "${APP_PORT:-8081}:8081"

    # Solo depende de mongo en local
    depends_on:
      mongo:
        condition: service_started
    networks:
      - demo-net
    restart: unless-stopped

networks:
  demo-net:
    driver: bridge

volumes:
  mongo_data: