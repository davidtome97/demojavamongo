# PRIORIDAD: si existe DB_URI (Atlas/remoto), se usa.
spring.data.mongodb.uri=${DB_URI:}

# Fallback local (docker compose)
spring.data.mongodb.host=${DB_HOST:mongo}
spring.data.mongodb.port=${DB_PORT:27017}

spring.data.mongodb.database=${DB_NAME:demo}
spring.data.mongodb.username=${DB_USER:demo}
spring.data.mongodb.password=${DB_PASSWORD:demo}
spring.data.mongodb.authentication-database=${DB_AUTH_DB:admin}

# (Recomendado) fallar rápido cuando el URI sea incorrecto
spring.data.mongodb.server-selection-timeout=10000
spring.data.mongodb.socket-timeout=10000

# En mongo desactiva JPA/DataSource
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration