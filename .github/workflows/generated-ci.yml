name: CI-demo-java-mongo

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Test (Maven)
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw -B -f pom.xml test
          else
            mvn -B -f pom.xml test
          fi

  sonar:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SonarCloud Analysis (optional)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "Sonar secrets not configured. Skipping Sonar analysis."
            exit 0
          fi

          # Default típico en SonarCloud si no lo defines
          if [ -z "$SONAR_HOST_URL" ]; then
            SONAR_HOST_URL="https://sonarcloud.io"
          fi

          SONAR_CMD="verify org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
            -Dsonar.organization=${SONAR_ORGANIZATION} \
            -Dsonar.host.url=${SONAR_HOST_URL}"

          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw -B -f pom.xml $SONAR_CMD
          else
            mvn -B -f pom.xml $SONAR_CMD
          fi

  build_and_push_ecr:
    runs-on: ubuntu-latest
    needs: build_and_test
    # Push a main y tags (NO PR)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building image: ${IMAGE_URI}"
          docker build -t "${IMAGE_URI}" .

          echo "Tagging latest..."
          docker tag "${IMAGE_URI}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Pushing images..."
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Done ✅"

  deploy_ec2:
    runs-on: ubuntu-latest
    needs: build_and_push_ecr
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Deploy en EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" <<EOF
          set -e

          cd ~/app
          rm -f .env*

          export COMPOSE_PROJECT_NAME=demo-java
          export COMPOSE_PROFILES="${DB_MODE:-local}"

          export IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          export DB_ENGINE="${DB_ENGINE}"
          export DB_PORT="${DB_PORT}"
          export DB_NAME="${DB_NAME}"
          export DB_USER="${DB_USER:-demo}"
          export DB_PASSWORD="${DB_PASSWORD:-demo}"
          export APP_PORT="${APP_PORT:-8082}"

          if [ "\$COMPOSE_PROFILES" = "remote" ]; then
            export DB_HOST="${DB_HOST}"
          else
            export DB_HOST="postgres"
          fi

          aws ecr get-login-password --region "${AWS_REGION}" \
            | sudo docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          sudo docker compose -p demo-java down --remove-orphans || true
          sudo docker compose -p demo-java pull
          sudo docker compose -p demo-java up -d

          sudo docker ps
          EOF