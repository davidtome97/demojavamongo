services:
  mongo:
    image: mongo:8
    container_name: demojava-mongo
    profiles: ["local"]     # ✅ solo arranca en local
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-demo}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-demo}
      MONGO_INITDB_DATABASE: ${DB_NAME:-demo}
    networks:
      - demo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ======== APP LOCAL (con mongo del compose) =======
  demo-java-local:
    image: ${IMAGE_URI:-demo-java-local}
    container_name: demo-java-app
    profiles: ["local"]
    environment:
      SPRING_PROFILES_ACTIVE: mongo
      DB_ENGINE: mongo

      # ✅ Local: construye URI con tu fallback (DB_HOST=mongo)
      DB_HOST: ${DB_HOST:-mongo}
      DB_PORT: ${DB_PORT:-27017}
      DB_NAME: ${DB_NAME:-demo}
      DB_USER: ${DB_USER:-demo}
      DB_PASSWORD: ${DB_PASSWORD:-demo}

      # ❌ NO poner SPRING_DATA_MONGODB_URI vacío
      # SPRING_DATA_MONGODB_URI: ...

    ports:
      - "${APP_PORT:-8081}:8081"
    networks:
      - demo-net
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

  # ========= APP REMOTA (Atlas) =========
  demo-java-remote:
    image: ${IMAGE_URI:-demo-java-local}
    container_name: demo-java-app
    profiles: ["remote"]
    environment:
      JAVA_TOOL_OPTIONS: "-Djdk.tls.client.protocols=TLSv1.2"
      SPRING_PROFILES_ACTIVE: mongo
      DB_ENGINE: mongo

      # ✅ Remoto: UNA sola fuente de verdad
      DB_URI: ${DB_URI}

      # (opcionales)
      DB_NAME: ${DB_NAME:-demo}
    ports:
      - "${APP_PORT:-8081}:8081"
    networks:
      - demo-net
    restart: unless-stopped

networks:
  demo-net:
    driver: bridge