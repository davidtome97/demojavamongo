services:
  # =========================
  # POSTGRES LOCAL (solo perfil local)
  # =========================
  postgres:
    image: postgres:16
    container_name: demojava-postgres
    profiles: ["local"]
    environment:
      POSTGRES_DB: ${DB_NAME:-demo}
      POSTGRES_USER: ${DB_USER:-demo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo}
    networks:
      - demo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-demo} -d ${DB_NAME:-demo}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # =========================
  # APP LOCAL (usa postgres del compose)
  # =========================
  demo-java-local:
    image: ${IMAGE_URI}
    build:
      context: .
      dockerfile: Dockerfile
    # ⛔️ evita conflicto de nombres
    container_name: demo-java-app-local
    profiles: ["local"]
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_ENGINE: postgres

      # ✅ dentro del compose, el host es el NOMBRE DEL SERVICIO
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-demo}
      DB_USER: ${DB_USER:-demo}
      DB_PASSWORD: ${DB_PASSWORD:-demo}
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - demo-net
    restart: unless-stopped

  # =========================
  # APP REMOTO (RDS) - NO levanta postgres local
  # =========================
  demo-java-remote:
    image: ${IMAGE_URI}
    build:
      context: .
      dockerfile: Dockerfile
    # ⛔️ evita conflicto de nombres
    container_name: demo-java-app-remote
    profiles: ["remote"]
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_ENGINE: postgres

      # ✅ en remoto: obligatorios (si falta algo, falla rápido y claro)
      DB_HOST: ${DB_HOST:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-demo}
    ports:
      - "${APP_PORT:-8081}:8081"
    networks:
      - demo-net
    restart: unless-stopped

networks:
  demo-net:
    driver: bridge